[build]
  command = "npm install && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_PUBLIC_API_URL = "https://transportmobileapp-b45c.onbelmo.uk/api"

# SPA routing — React Navigation web needs index.html for deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
